<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Wardrobe</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,serif}
  body{
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    opacity:0;
    visibility:hidden;
    transition:opacity .28s ease, visibility .28s ease;
  }
  .backdrop.open{opacity:1;visibility:visible}
  .card-wrap{
    position:relative;
    width:min(88vw,360px);
    max-height:94vh;
    transform:scale(.88);
    opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s ease;
  }
  .backdrop.open .card-wrap{transform:scale(1);opacity:1}
  .card-wrap img{
    display:block;
    width:100%;
    height:auto;
    max-height:90vh;
    object-fit:contain;
    border-radius:18px;
  }
  .close{
    position:absolute;
    right:-8px;
    top:-8px;
    width:42px;height:42px;
    border:0;border-radius:50%;
    background:#fff;
    color:#6f1717;
    font:700 26px/1 Arial,sans-serif;
    cursor:pointer;
    box-shadow:0 4px 18px rgba(0,0,0,.28);
    z-index:2;
  }
  .close:active{transform:scale(.94)}
  @media (prefers-reduced-motion:reduce){
    .backdrop,.card-wrap{transition:none}
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="card-wrap" role="dialog" aria-modal="true" aria-label="Dress code">
    <button class="close" id="closeBtn" type="button" aria-label="Close">×</button>
    <img id="cardImage" src="" alt="Dress code card">
  </div>
</div>

<script>
(() => {
  const backdrop = document.getElementById('backdrop');
  const image = document.getElementById('cardImage');
  const closeBtn = document.getElementById('closeBtn');

  const cards = {
    "1":"card1.png",
    "2":"card2.png",
    "3":"card3.png",
    "4":"card4.png"
  };

  function getCardNumber(){
    const params = new URLSearchParams(location.search);
    if (cards[params.get("card")]) return params.get("card");

    const hash = location.hash.replace("#","").toLowerCase();
    const match = hash.match(/^card([1-4])$/);
    return match ? match[1] : null;
  }

  function openCard(n){
    if (!cards[n]) return;
    image.src = cards[n];
    image.alt = "Dress code card " + n;
    backdrop.classList.add("open");
    backdrop.setAttribute("aria-hidden","false");
  }

  function closeCard(){
    backdrop.classList.remove("open");
    backdrop.setAttribute("aria-hidden","true");
  }

  closeBtn.addEventListener("click", closeCard);
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) closeCard();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeCard();
  });

  const n = getCardNumber();
  if (n) openCard(n);
})();
</script>
</body>
</html>
