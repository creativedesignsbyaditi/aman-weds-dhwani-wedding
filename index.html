<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0, viewport-fit=cover">
<title>Wedding Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:360px;height:720px;max-width:100vw;max-height:100dvh;overflow:hidden;background:#f4ecdf;perspective:1400px}

/* Exact envelope artwork supplied by you */
#envelope{position:absolute;inset:0;width:360px;height:720px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#body{position:absolute;left:0;bottom:0;width:360px;height:657px;display:block;z-index:2}
#flap{position:absolute;left:0;top:0;width:360px;height:445px;display:block;z-index:4;transform-origin:50% 0%;transform:rotateX(0deg);transition:transform 1.25s cubic-bezier(.18,.78,.2,1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#openButton{position:absolute;inset:0;z-index:10;border:0;background:transparent;cursor:pointer}
#envelope.open #flap{transform:rotateX(-78deg) translateY(-12px)}
#envelope.open #openButton{pointer-events:none}

/* Smooth transition to Canva */
#fade{position:absolute;inset:0;z-index:50;background:#f4ecdf;opacity:0;pointer-events:none;transition:opacity .55s ease}
#fade.show{opacity:1}

/* Music button */
#musicBtn{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:19px;z-index:30;cursor:pointer;backdrop-filter:blur(6px)}
@media(max-width:359px){#app{transform:scale(calc(100vw / 360));transform-origin:center center}}
</style>
</head>
<body>
<div id="app">

  <div id="envelope" aria-label="Open wedding invitation">
    <img id="body" src="body.png" alt="">
    <img id="flap" src="flap.png" alt="">
    <button id="openButton" aria-label="Open invitation"></button>
  </div>

  <button id="musicBtn" aria-label="Turn music on">🔇</button>
  <div id="fade"></div>

  <audio id="bgMusic" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const CANVA_URL = "https://amanwedsdhwani.life/bride";

const envelope = document.getElementById("envelope");
const openButton = document.getElementById("openButton");
const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");
const fade = document.getElementById("fade");

let opened = false;

async function startMusic(){
  try{
    await music.play();
    musicBtn.textContent = "🎵";
    musicBtn.setAttribute("aria-label","Turn music off");
  }catch(error){
    musicBtn.textContent = "🔇";
    musicBtn.setAttribute("aria-label","Turn music on");
  }
}

openButton.addEventListener("click", async () => {
  if(opened) return;
  opened = true;

  /* Start music from the user's tap */
  await startMusic();

  /* Open the supplied flap artwork */
  envelope.classList.add("open");

  /* Fade smoothly before leaving */
  setTimeout(() => fade.classList.add("show"), 1000);

  /* Open the Canva website on the same tab */
  setTimeout(() => {
    window.location.href = CANVA_URL;
  }, 1550);
});

musicBtn.addEventListener("click", async (event) => {
  event.stopPropagation();

  if(music.paused){
    await startMusic();
  }else{
    music.pause();
    musicBtn.textContent = "🔇";
    musicBtn.setAttribute("aria-label","Turn music on");
  }
});
</script>
</body>
</html>
