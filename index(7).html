<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wedding Invitation</title>
<style>
*{box-sizing:border-box}

/* =========================
   EASY ENVELOPE SETTINGS
   Change ONLY these values.
   Width stays at 360px.
   ========================= */
:root{
  --body-top:0px;       /* Body vertical position */
  --body-height:800px;   /* Overall envelope body length */
  --body-art-height:657px; /* Keep original artwork at natural height */
  --flap-top:0px;        /* Flap vertical position */
  --flap-height:445px;   /* Flap length/height */
}

html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f4f2dc}
body{display:flex;justify-content:center;align-items:flex-start}
#stage{
  position:relative;
  width:360px;
  height:720px;
  min-width:360px;
  min-height:720px;
  overflow:hidden;
  background:#f4f2dc;
  isolation:isolate;
}
/* Your original envelope body */
#body{
  position:absolute;
  left:0;
  top:var(--body-top);
  width:360px;
  height:var(--body-height);
  z-index:2;
  transition:transform 1.15s cubic-bezier(.22,.72,.2,1), opacity .35s ease;
}
#body{
  background:rgb(240,230,216);
}
#body img{
  display:block;
  width:360px;
  height:var(--body-art-height);
  object-fit:fill;
}
#body::after{
  content:"";
  position:absolute;
  left:0;
  top:var(--body-art-height);
  width:360px;
  height:calc(var(--body-height) - var(--body-art-height));
  background:rgb(240,230,216);
}
/* Your original flap + wax seal */
#flap{
  position:absolute;
  left:0;
  top:var(--flap-top);
  width:360px;
  height:var(--flap-height);
  z-index:4;
  transform-origin:50% 100%;
  transition:transform 1.15s cubic-bezier(.22,.72,.2,1), opacity .25s ease;
  will-change:transform;
}
#flap img{
  display:block;
  width:360px;
  height:var(--flap-height);
  object-fit:fill;
}
/* Optional text seen in your reference video */
#openText{
  position:absolute;
  left:35px;
  top:230px;
  width:290px;
  height:105px;
  z-index:6;
  pointer-events:none;
  overflow:visible;
  transition:opacity .3s ease, transform .3s ease;
}
#openText svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}
#openText text{
  fill:#8d5260;
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  letter-spacing:1px;
  font-weight:400;
}

#hotspot{
  position:absolute;
  left:0;
  top:var(--flap-top);
  width:360px;
  height:var(--flap-height);
  z-index:10;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#card{
  position:absolute;
  left:0;
  top:0;
  width:360px;
  height:720px;
  z-index:20;
  border:0;
  padding:0;
  margin:0;
  background:#f4f2dc;
  opacity:0;
  transform:scale(.88);
  transform-origin:50% 50%;
  pointer-events:none;
  transition:opacity .45s ease, transform .7s cubic-bezier(.18,.8,.2,1);
}
#card{
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
}
#card iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#f4f2dc;
}
#card iframe::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

.open #flap{
  transform:translateY(calc(-1 * var(--flap-height)));
}
.open #body{
  transform:translateY(720px);
}
.open #openText{
  opacity:0;
  transform:translateY(-30px);
}
.open #hotspot{
  pointer-events:none;
}
.show-card #card{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}
@media(max-width:359px){
  body{display:block}
  #stage{transform-origin:top left;transform:scale(calc(100vw / 360));}
}
@media(prefers-reduced-motion:reduce){
  #body,#flap,#openText,#card{transition-duration:.01ms}
}
</style>
</head>

<script>
const INVITATION_URL = "https://amanwedsdhwani.life/bride-invite";
const stage = document.getElementById("stage");
const hotspot = document.getElementById("hotspot");

let opened = false;

hotspot.addEventListener("click", () => {
  if (opened) return;
  opened = true;

  hotspot.disabled = true;
  stage.classList.add("open");

  // Let the envelope opening animation complete,
  // then open the real Canva website directly.
  setTimeout(() => {
    window.location.href = INVITATION_URL;
  }, 1150);
});

hotspot.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    hotspot.click();
  }
});
</script>
